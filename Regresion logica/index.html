<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Riesgo de Hipertensión</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 500px;
        width: 100%;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 28px;
        text-align: center;
      }

      .subtitle {
        color: #666;
        text-align: center;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 25px;
      }

      label {
        display: block;
        color: #555;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 14px;
      }

      input[type="number"] {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 16px;
        transition: all 0.3s ease;
        background: #f8f9fa;
      }

      input[type="number"]:focus {
        outline: none;
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .info-text {
        font-size: 12px;
        color: #888;
        margin-top: 4px;
      }

      button {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        margin-top: 10px;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      button:active {
        transform: translateY(0);
      }

      .result {
        margin-top: 30px;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        font-size: 18px;
        font-weight: 600;
        display: none;
      }

      .result.show {
        display: block;
        animation: slideIn 0.5s ease;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .result.risk {
        background: #fee;
        color: #c33;
        border: 2px solid #fcc;
      }

      .result.no-risk {
        background: #efe;
        color: #3c3;
        border: 2px solid #cfc;
      }

      .result-icon {
        font-size: 40px;
        margin-bottom: 10px;
      }

      .result-text {
        font-size: 16px;
        margin-top: 10px;
        font-weight: normal;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🩺 Calculadora de Riesgo de Hipertensión</h1>
      <p class="subtitle">
        Complete los siguientes datos para evaluar el riesgo
      </p>

      <form id="hypertensionForm">
        <div class="form-group">
          <label for="edad">Edad (años)</label>
          <input type="number" id="edad" required min="0" max="120" />
        </div>

        <div class="form-group">
          <label for="imc">IMC (Índice de Masa Corporal)</label>
          <input
            type="number"
            id="imc"
            step="0.01"
            required
            min="10"
            max="60"
          />
          <div class="info-text">Permite decimales (ej: 25.5)</div>
        </div>

        <div class="form-group">
          <label for="presion">Presión Arterial (mmHg)</label>
          <input
            type="number"
            id="presion"
            step="0.01"
            required
            min="50"
            max="250"
          />
          <div class="info-text">Permite decimales (ej: 120.5)</div>
        </div>

        <div class="form-group">
          <label for="sal">Consumo de Sal (1-5)</label>
          <input type="number" id="sal" required min="1" max="5" />
          <div class="info-text">1 = Bajo, 5 = Alto</div>
        </div>

        <div class="form-group">
          <label for="actividad">Actividad Física (1-5)</label>
          <input type="number" id="actividad" required min="1" max="5" />
          <div class="info-text">1 = Sedentario, 5 = Muy activo</div>
        </div>

        <button type="submit">Calcular Riesgo</button>
      </form>

      <div id="result" class="result">
        <div class="result-icon"></div>
        <div id="resultText"></div>
        <div class="result-text" id="resultDescription"></div>
      </div>
    </div>

    <script>
      const form = document.getElementById("hypertensionForm");
      const resultDiv = document.getElementById("result");
      const resultText = document.getElementById("resultText");
      const resultDescription = document.getElementById("resultDescription");
      const resultIcon = document.querySelector(".result-icon");

      // Coeficientes y intercepto del modelo
      const coeficientes = [
        0.10687173, 0.32500203, 0.10725232, 1.24477295, -1.70351044,
      ];
      const intercepto = -29.27945642;

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        // Obtener valores de entrada
        const edad = parseFloat(document.getElementById("edad").value);
        const imc = parseFloat(document.getElementById("imc").value);
        const presion = parseFloat(document.getElementById("presion").value);
        const sal = parseFloat(document.getElementById("sal").value);
        const actividad = parseFloat(
          document.getElementById("actividad").value
        );

        // Calcular el valor z (regresión logística)
        const z =
          intercepto +
          coeficientes[0] * edad +
          coeficientes[1] * imc +
          coeficientes[2] * presion +
          coeficientes[3] * sal +
          coeficientes[4] * actividad;

        // Aplicar función sigmoide
        const probabilidad = 1 / (1 + Math.exp(-z));

        // Determinar riesgo (umbral 0.5)
        const tieneRiesgo = probabilidad >= 0.5 ? 1 : 0;

        // Mostrar resultado
        resultDiv.classList.remove("risk", "no-risk");
        resultDiv.classList.add("show");

        if (tieneRiesgo === 1) {
          resultDiv.classList.add("risk");
          resultIcon.textContent = "⚠️";
          resultText.textContent = "RIESGO DE HIPERTENSIÓN DETECTADO";
          resultDescription.textContent = `Probabilidad: ${(
            probabilidad * 100
          ).toFixed(
            1
          )}%. Se recomienda consultar con un profesional de la salud.`;
        } else {
          resultDiv.classList.add("no-risk");
          resultIcon.textContent = "✅";
          resultText.textContent = "RIESGO BAJO DE HIPERTENSIÓN";
          resultDescription.textContent = `Probabilidad: ${(
            probabilidad * 100
          ).toFixed(1)}%. Continúe con hábitos saludables.`;
        }
      });
    </script>
  </body>
</html>
